<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pearl St 3D — MapLibre</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif; }
#map { width: 100vw; height: 100vh; }

#panel {
  position: absolute; top: 20px; left: 20px; z-index: 10;
  background: rgba(255,255,255,0.97); border-radius: 14px; padding: 20px;
  max-width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  backdrop-filter: blur(20px);
}
#panel h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.3px; }
#panel .subtitle { font-size: 12px; color: #6b7280; margin-bottom: 14px; }
#panel .stat-row { display: flex; gap: 12px; margin: 10px 0; }
#panel .stat { text-align: center; flex: 1; }
#panel .stat-num { font-size: 22px; font-weight: 700; color: #3b82f6; }
#panel .stat-label { font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }
.legend { margin-top: 12px; border-top: 1px solid #f3f4f6; padding-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 11px; color: #4b5563; }
.legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

.maplibregl-popup-content {
  padding: 12px 16px; border-radius: 10px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.maplibregl-popup-content strong { color: #3b82f6; }
.maplibregl-popup-content .tag {
  display: inline-block; padding: 2px 6px; border-radius: 4px;
  font-size: 10px; font-weight: 600; margin-top: 4px;
  background: #e0f2fe; color: #0369a1;
}

#view-toggle {
  position: absolute; top: 20px; right: 20px; z-index: 10;
  background: rgba(255,255,255,0.97); border-radius: 10px; padding: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15); backdrop-filter: blur(20px);
}
#view-toggle a {
  font-size: 11px; color: #6b7280; text-decoration: none;
  display: block; padding: 4px 8px;
}
#view-toggle a:hover { color: #3b82f6; }
</style>
</head>
<body>

<div id="panel">
  <h1>Pearl Street 3D</h1>
  <div class="subtitle">Pearl Street Mall, Boulder CO — 13th to 17th</div>
  <div class="stat-row">
    <div class="stat"><div class="stat-num">275</div><div class="stat-label">Buildings</div></div>
    <div class="stat"><div class="stat-num">57</div><div class="stat-label">VLM Facades</div></div>
    <div class="stat"><div class="stat-num">32</div><div class="stat-label">Signs</div></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background: linear-gradient(135deg, #8B4513, #6b8e6b)"></div> VLM-informed facade color</div>
    <div class="legend-item"><div class="legend-swatch" style="background: #3a7a3a"></div> Overture trees</div>
    <div class="legend-item"><div class="legend-swatch" style="background: #3b82f6"></div> SNIP sign detections</div>
  </div>
</div>

<div id="view-toggle">
  <a href="index_threejs.html">Switch to Three.js viewer</a>
</div>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const CENTER = [-105.27600, 40.01901];
const BOUNDS = [[-105.2805, 40.0168], [-105.2715, 40.0212]];

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      'carto': {
        type: 'raster',
        tiles: ['https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png'],
        tileSize: 256,
        attribution: '&copy; CARTO, &copy; OpenStreetMap contributors'
      }
    },
    layers: [{
      id: 'base',
      type: 'raster',
      source: 'carto'
    }]
  },
  center: CENTER,
  zoom: 17,
  pitch: 55,
  bearing: -15,
  maxBounds: [[-105.285, 40.015], [-105.268, 40.023]],
  antialias: true
});

map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

map.on('load', async () => {
  // Load GeoJSON data
  const [buildingsResp, treesResp, signsResp, roadsResp] = await Promise.all([
    fetch('buildings.geojson'),
    fetch('trees.geojson'),
    fetch('signs.geojson'),
    fetch('roads.geojson'),
  ]);

  const buildings = await buildingsResp.json();
  const trees = await treesResp.json();
  const signs = await signsResp.json();
  const roads = await roadsResp.json();

  // === ROADS ===
  map.addSource('roads', { type: 'geojson', data: roads });
  map.addLayer({
    id: 'roads-line',
    type: 'line',
    source: 'roads',
    paint: {
      'line-color': '#e8e2da',
      'line-width': ['case',
        ['==', ['get', 'class'], 'pedestrian'], 8,
        ['==', ['get', 'class'], 'residential'], 5,
        4
      ],
      'line-opacity': 0.7
    }
  });

  // === BUILDINGS (fill-extrusion) ===
  map.addSource('buildings', { type: 'geojson', data: buildings });

  map.addLayer({
    id: 'buildings-extrusion',
    type: 'fill-extrusion',
    source: 'buildings',
    paint: {
      'fill-extrusion-color': ['get', 'color'],
      'fill-extrusion-height': ['get', 'height'],
      'fill-extrusion-base': 0,
      'fill-extrusion-opacity': 0.92,
    }
  });

  // Roof outline for depth
  map.addLayer({
    id: 'buildings-outline',
    type: 'line',
    source: 'buildings',
    paint: {
      'line-color': 'rgba(0,0,0,0.15)',
      'line-width': 0.5,
    }
  });

  // === TREES ===
  map.addSource('trees', { type: 'geojson', data: trees });
  map.addLayer({
    id: 'trees-circle',
    type: 'circle',
    source: 'trees',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 15, 3, 18, 8],
      'circle-color': '#4a8a4a',
      'circle-opacity': 0.8,
      'circle-blur': 0.3,
    }
  });

  // Tree canopy shadow
  map.addLayer({
    id: 'trees-shadow',
    type: 'circle',
    source: 'trees',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 15, 4, 18, 10],
      'circle-color': '#2a5a2a',
      'circle-opacity': 0.3,
      'circle-blur': 0.8,
      'circle-translate': [2, 2],
    }
  }, 'trees-circle');

  // === SIGNS ===
  map.addSource('signs', { type: 'geojson', data: signs });
  map.addLayer({
    id: 'signs-label',
    type: 'symbol',
    source: 'signs',
    minzoom: 16,
    layout: {
      'text-field': ['get', 'name'],
      'text-size': ['interpolate', ['linear'], ['zoom'], 16, 10, 19, 14],
      'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
      'text-anchor': 'bottom',
      'text-offset': [0, -0.5],
      'text-max-width': 12,
    },
    paint: {
      'text-color': '#1e293b',
      'text-halo-color': '#ffffff',
      'text-halo-width': 1.5,
    }
  });

  // Sign marker dots
  map.addLayer({
    id: 'signs-dot',
    type: 'circle',
    source: 'signs',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 15, 3, 18, 5],
      'circle-color': '#3b82f6',
      'circle-stroke-color': '#ffffff',
      'circle-stroke-width': 1.5,
    }
  });

  // === INTERACTIVITY ===
  const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });

  map.on('mouseenter', 'buildings-extrusion', (e) => {
    map.getCanvas().style.cursor = 'pointer';
    const props = e.features[0].properties;
    const pois = props.pois || '';
    const material = props.material || '';
    const stories = props.stories || '?';
    const source = props.source === 'vlm' ? '<span class="tag">VLM</span>' : '';

    let html = '';
    if (pois) html += '<strong>' + pois + '</strong><br>';
    html += material + ' — ' + stories + ' stories ' + source;

    popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
  });

  map.on('mouseleave', 'buildings-extrusion', () => {
    map.getCanvas().style.cursor = '';
    popup.remove();
  });

  map.on('mouseenter', 'signs-dot', (e) => {
    map.getCanvas().style.cursor = 'pointer';
    const name = e.features[0].properties.name;
    popup.setLngLat(e.lngLat).setHTML('<strong>' + name + '</strong>').addTo(map);
  });

  map.on('mouseleave', 'signs-dot', () => {
    map.getCanvas().style.cursor = '';
    popup.remove();
  });
});
</script>
</body>
</html>
