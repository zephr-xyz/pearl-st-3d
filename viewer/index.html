<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pearl St 3D — Procedural Building Rendering POC</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif; overflow: hidden; }
#canvas { width: 100vw; height: 100vh; display: block; }

#panel {
  position: absolute; top: 20px; left: 20px; z-index: 10;
  background: rgba(255,255,255,0.97); border-radius: 14px; padding: 20px;
  max-width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  backdrop-filter: blur(20px);
}
#panel h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.3px; }
#panel .subtitle { font-size: 12px; color: #6b7280; margin-bottom: 14px; }
#panel .stat-row { display: flex; gap: 12px; margin: 10px 0; }
#panel .stat { text-align: center; flex: 1; }
#panel .stat-num { font-size: 22px; font-weight: 700; color: #3b82f6; }
#panel .stat-label { font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }

.legend { margin-top: 12px; border-top: 1px solid #f3f4f6; padding-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 11px; color: #4b5563; }
.legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

#controls {
  position: absolute; top: 20px; right: 20px; z-index: 10;
  background: rgba(255,255,255,0.97); border-radius: 14px; padding: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15); backdrop-filter: blur(20px);
}
#controls button {
  display: block; width: 100%; padding: 9px 14px; margin: 3px 0;
  border: none; border-radius: 8px; background: #f9fafb;
  cursor: pointer; font-size: 12px; text-align: left;
  font-weight: 500; color: #374151; transition: all 0.15s;
}
#controls button:hover { background: #eef2ff; }
#controls button.active { background: #3b82f6; color: #fff; }
#controls .section-label { font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 0 4px; }

#tooltip {
  position: absolute; z-index: 20; background: rgba(15,23,42,0.92);
  color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 12px;
  pointer-events: none; display: none; max-width: 320px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3); backdrop-filter: blur(8px);
  line-height: 1.5;
}
#tooltip strong { color: #93c5fd; }
#tooltip .tag {
  display: inline-block; padding: 2px 6px; border-radius: 4px;
  font-size: 10px; font-weight: 600; margin-top: 4px;
}
#tooltip .tag-direct { background: #059669; color: #fff; }
#tooltip .tag-transfer { background: #d97706; color: #fff; }

#loading-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: #0f172a;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.4s;
}
#loading-overlay.hidden { opacity: 0; pointer-events: none; }
#loading-overlay h2 { color: #e2e8f0; font-size: 18px; font-weight: 600; margin-bottom: 20px; letter-spacing: -0.3px; }
#loading-bar-track {
  width: 260px; height: 6px; border-radius: 3px; background: #1e293b; overflow: hidden;
}
#loading-bar-fill {
  height: 100%; width: 0%; border-radius: 3px;
  background: linear-gradient(90deg, #3b82f6, #60a5fa);
  transition: width 0.3s ease;
}
#loading-status { color: #94a3b8; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div id="panel">
  <h1>Procedural 3D Buildings</h1>
  <div class="subtitle">Pearl Street Mall, Boulder CO — 13th to 17th</div>
  <div class="stat-row">
    <div class="stat"><div class="stat-num">830</div><div class="stat-label">Buildings</div></div>
    <div class="stat"><div class="stat-num">6008</div><div class="stat-label">Facades</div></div>
    <div class="stat"><div class="stat-num">201</div><div class="stat-label">Trees</div></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background: linear-gradient(135deg, #8B4513, #6b8e6b)"></div> Procedural facade (VLM-informed)</div>
    <div class="legend-item"><div class="legend-swatch" style="background: #cc2222"></div> 3D awnings from visual descriptions</div>
    <div class="legend-item"><div class="legend-swatch" style="background: #3a7a3a"></div> OSM trees + Overture infrastructure</div>
  </div>
</div>

<div id="controls">
  <div class="section-label">Render Mode</div>
  <button id="btn-textured" class="active">Photo Textures + Transfer</button>
  <button id="btn-color">Visual Description Colors</button>
  <button id="btn-wireframe">Wireframe Only</button>
  <div class="section-label" style="margin-top: 12px">Camera</div>
  <button id="btn-street">Street Level</button>
  <button id="btn-birds">Bird's Eye</button>
  <button id="btn-orbit">Orbit (default)</button>
</div>

<div id="loading-overlay">
  <h2>Pearl Street 3D</h2>
  <div id="loading-bar-track"><div id="loading-bar-fill"></div></div>
  <div id="loading-status">Loading scene...</div>
</div>

<div id="tooltip"></div>
<canvas id="canvas"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('canvas');
const tooltip = document.getElementById('tooltip');
const textureLoader = new THREE.TextureLoader();
textureLoader.crossOrigin = 'anonymous';

const loadingOverlay = document.getElementById('loading-overlay');
const loadingFill = document.getElementById('loading-bar-fill');
const loadingStatus = document.getElementById('loading-status');
function setProgress(pct, msg) {
  loadingFill.style.width = pct + '%';
  loadingStatus.textContent = msg;
}

// Scene setup
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd4eaf7, 800, 6000);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 8000);
camera.position.set(180, 40, -120);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.8;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const controls = new OrbitControls(camera, canvas);
controls.target.set(-10, 4, -20);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 5;
controls.maxDistance = 3000;

// Lighting — soft, even illumination (Mapbox-style flat clarity)
const ambient = new THREE.HemisphereLight(0xffffff, 0xe8e0d8, 0.9);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(80, 60, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -200;
sun.shadow.camera.right = 200;
sun.shadow.camera.top = 200;
sun.shadow.camera.bottom = -200;
sun.shadow.bias = -0.0001;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xf0f0ff, 0.5);
fill.position.set(-40, 30, -30);
scene.add(fill);

const back = new THREE.DirectionalLight(0xfff8f0, 0.3);
back.position.set(-10, 40, -50);
scene.add(back);

// Sky — procedural gradient with clouds
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 1024; skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext('2d');

// Gradient: deep blue at top → lighter blue → warm white at horizon
const grad = skyCtx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0, '#4a90d9');
grad.addColorStop(0.3, '#7ab8e8');
grad.addColorStop(0.6, '#a8d4f0');
grad.addColorStop(0.85, '#d4eaf7');
grad.addColorStop(1.0, '#f0ece6');
skyCtx.fillStyle = grad;
skyCtx.fillRect(0, 0, 1024, 512);

// Procedural clouds
skyCtx.globalAlpha = 0.6;
for (let i = 0; i < 40; i++) {
  const cx = Math.random() * 1024;
  const cy = 120 + Math.random() * 200;
  const w = 60 + Math.random() * 150;
  const h = 20 + Math.random() * 40;
  const cloudGrad = skyCtx.createRadialGradient(cx, cy, 0, cx, cy, w/2);
  cloudGrad.addColorStop(0, 'rgba(255,255,255,0.8)');
  cloudGrad.addColorStop(0.5, 'rgba(255,255,255,0.4)');
  cloudGrad.addColorStop(1, 'rgba(255,255,255,0)');
  skyCtx.fillStyle = cloudGrad;
  skyCtx.fillRect(cx - w/2, cy - h/2, w, h);
  // Puff clusters
  for (let p = 0; p < 3; p++) {
    const px = cx + (Math.random() - 0.5) * w * 0.6;
    const py = cy + (Math.random() - 0.5) * h * 0.8;
    const pr = 15 + Math.random() * 30;
    const pGrad = skyCtx.createRadialGradient(px, py, 0, px, py, pr);
    pGrad.addColorStop(0, 'rgba(255,255,255,0.7)');
    pGrad.addColorStop(1, 'rgba(255,255,255,0)');
    skyCtx.fillStyle = pGrad;
    skyCtx.beginPath();
    skyCtx.arc(px, py, pr, 0, Math.PI * 2);
    skyCtx.fill();
  }
}
skyCtx.globalAlpha = 1.0;

const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.mapping = THREE.EquirectangularReflectionMapping;
skyTex.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTex;

// Load scene data
setProgress(10, 'Loading buildings...');
const resp = await fetch('scene.json', { cache: 'no-store' });
const data = await resp.json();
window._sceneData = data; // make accessible to top-level createBuilding
setProgress(40, 'Loading terrain...');

// Load terrain for elevation lookup
const terrainResp = await fetch('terrain.json');
const terrain = await terrainResp.json();
setProgress(55, 'Building 3D geometry...');
const tW = terrain.width, tH = terrain.height;
const baseElev = terrain.base_elevation;
const cosLat = Math.cos(terrain.ref_lat * Math.PI / 180);
const mPerDegLat = 111320;
const mPerDegLon = 111320 * cosLat;
const terrainWidthM = (terrain.se_lon - terrain.nw_lon) * mPerDegLon;
const terrainHeightM = (terrain.nw_lat - terrain.se_lat) * mPerDegLat;
const terrainCenterX = (((terrain.nw_lon + terrain.se_lon) / 2) - terrain.ref_lon) * mPerDegLon;
const terrainCenterZ = (((terrain.nw_lat + terrain.se_lat) / 2) - terrain.ref_lat) * mPerDegLat;

// Sample terrain elevation at scene (x, z) coordinates
function getTerrainElevation(x, z) {
  // Convert scene coords to terrain grid position
  // Scene: x = (lon - ref_lon)*mPerDegLon, z = (lat - ref_lat)*mPerDegLat
  // Terrain grid: col = (lon - nw_lon)/(se_lon - nw_lon)*(tW-1)
  //               row = (nw_lat - lat)/(nw_lat - se_lat)*(tH-1)
  // x = (lon - ref_lon)*mPerDegLon → lon = x/mPerDegLon + ref_lon
  // z = (lat - ref_lat)*mPerDegLat → lat = z/mPerDegLat + ref_lat
  const lon = x / mPerDegLon + terrain.ref_lon;
  const lat = z / mPerDegLat + terrain.ref_lat;
  const col = (lon - terrain.nw_lon) / (terrain.se_lon - terrain.nw_lon) * (tW - 1);
  const row = (terrain.nw_lat - lat) / (terrain.nw_lat - terrain.se_lat) * (tH - 1);
  if (col < 0 || col >= tW - 1 || row < 0 || row >= tH - 1) return 0;
  // Bilinear interpolation
  const c0 = Math.floor(col), c1 = c0 + 1;
  const r0 = Math.floor(row), r1 = r0 + 1;
  const fc = col - c0, fr = row - r0;
  const e00 = terrain.elevations[r0 * tW + c0] - baseElev;
  const e01 = terrain.elevations[r0 * tW + c1] - baseElev;
  const e10 = terrain.elevations[r1 * tW + c0] - baseElev;
  const e11 = terrain.elevations[r1 * tW + c1] - baseElev;
  return e00 * (1-fc)*(1-fr) + e01 * fc*(1-fr) + e10 * (1-fc)*fr + e11 * fc*fr;
}

// Texture cache
const textures = {};
function loadTexture(path) {
  if (!textures[path]) {
    textures[path] = textureLoader.load(path);
    textures[path].colorSpace = THREE.SRGBColorSpace;
  }
  return textures[path];
}

function hexToColor(hex) {
  return new THREE.Color(hex);
}

// Procedural window texture
function createProceduralFacade(style, wall, isPrimary, bldId) {
  isPrimary = isPrimary || false;
  const width = wall.length;
  const height = wall.height;
  const entrances = wall.entrances || [];

  const W = 512;
  const H = Math.round(W * (height / Math.max(width, 1)));
  const canvas2d = document.createElement('canvas');
  canvas2d.width = W;
  canvas2d.height = H;
  const ctx = canvas2d.getContext('2d');

  const stories = style.stories || 2;
  const floorH = H / stories;

  // trim: only use accent when it was explicitly described (not null/undefined).
  // Fallback to facade color so frames and bands don't invent white stripes.
  const trim = style.accent || style.color || '#d4c5a9';

  // Compute exclusion zones around entrances (used throughout)
  const pxPerMeter = W / width;
  const doorW = 0.9 * pxPerMeter;
  const exclusionRadius = doorW * 2.0;
  function inEntranceZone(px) {
    for (const ent of entrances) {
      if (Math.abs(px - ent.t * W) < exclusionRadius) return true;
    }
    return false;
  }

  // === BASE WALL === (Mapbox building fill #D9D3C8 for generic)
  ctx.fillStyle = style.color || '#D9D3C8';
  ctx.fillRect(0, 0, W, H);

  // Material texture — detailed brick coursework with mortar
  if (style.material && style.material.includes('brick')) {
    const brickH = 6, brickW = 18, mortarW = 1.5;
    // Mortar lines
    ctx.fillStyle = 'rgba(180,170,155,0.35)';
    for (let y = 0; y < H; y += brickH + mortarW) {
      ctx.fillRect(0, y, W, mortarW);
    }
    // Vertical mortar (offset every other row)
    for (let y = 0; y < H; y += brickH + mortarW) {
      const rowIdx = Math.floor(y / (brickH + mortarW));
      const rowOff = (rowIdx % 2) * (brickW / 2);
      for (let x = rowOff; x < W; x += brickW + mortarW) {
        ctx.fillRect(x, y, mortarW, brickH);
      }
    }
    // Brick color variation
    ctx.globalAlpha = 0.06;
    for (let y = 0; y < H; y += brickH + mortarW) {
      const rowIdx = Math.floor(y / (brickH + mortarW));
      const rowOff = (rowIdx % 2) * (brickW / 2);
      for (let x = rowOff; x < W; x += brickW + mortarW) {
        const shade = Math.random();
        ctx.fillStyle = shade > 0.6 ? '#000' : (shade > 0.3 ? '#fff' : '#804020');
        ctx.fillRect(x + mortarW, y + mortarW, brickW - 1, brickH - 1);
      }
    }
    ctx.globalAlpha = 1.0;
  } else if (style.material === 'stone') {
    // Rough stone blocks with visible joints
    const stoneH = 14, stoneW = 28;
    ctx.globalAlpha = 0.12;
    for (let y = 0; y < H; y += stoneH + 2) {
      const rowOff = (Math.floor(y / (stoneH + 2)) % 2) * (stoneW * 0.4);
      for (let x = rowOff - stoneW; x < W + stoneW; x += stoneW + 2) {
        ctx.fillStyle = Math.random() > 0.5 ? '#000' : '#fff';
        ctx.fillRect(x, y, stoneW, stoneH);
      }
    }
    ctx.fillStyle = 'rgba(100,90,70,0.2)';
    for (let y = 0; y < H; y += stoneH + 2) {
      ctx.fillRect(0, y, W, 2);
    }
    ctx.globalAlpha = 1.0;
  } else if (style.material === 'stucco' || style.material === 'painted_brick' || style.material === 'siding') {
    ctx.globalAlpha = 0.04;
    for (let i = 0; i < 400; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#000' : '#fff';
      const s = Math.random() * 3 + 1;
      ctx.fillRect(Math.random() * W, Math.random() * H, s, s);
    }
    ctx.globalAlpha = 1.0;
  }

  // === ART DECO TREATMENT ===
  if (style.arch_style === 'art_deco' && bldId === '9022e165-3bc1-48c6-a382-4cfc8d5eb9fe') {
    // Dark green painted ground floor
    const gfTop = (stories - 1) * floorH;
    ctx.fillStyle = '#2a5a1a';
    ctx.fillRect(0, gfTop, W, H - gfTop);

    // Sunburst fan — center top, spreading downward
    const fanCX = W / 2;
    const fanCY = H * 0.06;
    const fanR  = H * 0.30;
    const numRays = 14;
    const rayColors = ['#c8a832', '#8a6030', '#2a6a50', '#c8a832', '#a87828'];
    for (let ri = 0; ri < numRays; ri++) {
      const a0 = (Math.PI * ri) / numRays;
      const a1 = (Math.PI * (ri + 0.88)) / numRays;
      ctx.beginPath();
      ctx.moveTo(fanCX, fanCY);
      ctx.arc(fanCX, fanCY, fanR, a0, a1);
      ctx.closePath();
      ctx.fillStyle = rayColors[ri % rayColors.length];
      ctx.globalAlpha = 0.72;
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // Central arched window (behind fan, upper section)
    const archW = W * 0.14;
    const archBottom = gfTop - H * 0.04;
    const archTop = fanCY + fanR * 0.25;
    const archMid = archTop + (archBottom - archTop) * 0.30;
    ctx.fillStyle = '#1a3a4a';
    ctx.beginPath();
    ctx.moveTo(fanCX - archW / 2, archBottom);
    ctx.lineTo(fanCX - archW / 2, archMid);
    ctx.arc(fanCX, archMid, archW / 2, Math.PI, 0);
    ctx.lineTo(fanCX + archW / 2, archBottom);
    ctx.closePath();
    ctx.fill();

    // Vertical pilasters
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#f0ebd0';
    const pilW2 = W * 0.022;
    for (const px of [W * 0.12, W * 0.33, W * 0.67, W * 0.88]) {
      ctx.fillRect(px - pilW2 / 2, H * 0.12, pilW2, gfTop - H * 0.12);
    }
    ctx.globalAlpha = 1.0;
  }

  // === CORNICE ===
  const corniceH = Math.max(8, H * 0.035);
  ctx.fillStyle = trim;
  ctx.fillRect(0, 0, W, corniceH);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(0, corniceH, W, 2);

  // Pediment (Odd Fellows)
  if (style.pediment) {
    ctx.fillStyle = trim;
    ctx.beginPath();
    ctx.moveTo(W * 0.3, corniceH);
    ctx.lineTo(W * 0.5, corniceH - H * 0.04);
    ctx.lineTo(W * 0.7, corniceH);
    ctx.closePath();
    ctx.fill();
  }

  // === FLOOR DIVIDERS ===
  // Subtle shadow line — never a colored band unless accent explicitly set
  for (let f = 1; f < stories; f++) {
    const ly = f * floorH;
    if (style.accent) {
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = trim;
      ctx.fillRect(0, ly - 1, W, 2);
      ctx.globalAlpha = 1.0;
    }
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fillRect(0, ly + 1, W, 1.5);
    ctx.globalAlpha = 1.0;
  }

  // === SIGNAGE BAND (between cornice and first window row, or above ground floor) ===
  const signage = style.signage;
  if (signage && stories >= 1 && style.arch_style !== 'art_deco') {
    const bandY = stories === 1 ? corniceH + 4 : (stories - 1) * floorH + 4;
    const bandH = floorH * 0.18;
    ctx.fillStyle = signage.band_color || '#2a2a2a';
    ctx.fillRect(0, bandY, W, bandH);
    // Signage text placeholder (light rectangle)
    ctx.fillStyle = signage.color || '#ffffff';
    ctx.globalAlpha = 0.8;
    const textW = W * 0.35;
    ctx.fillRect(W/2 - textW/2, bandY + bandH * 0.2, textW, bandH * 0.6);
    ctx.globalAlpha = 1.0;
  }

  // === UPPER FLOOR WINDOWS ===
  if (stories > 1) {
    const gridCols = style.window_grid && style.window_grid.cols > 0 ? style.window_grid.cols : 0;
    const winsPerFloor = gridCols > 0 ? gridCols :
      (style.windows === 'vertical_triple' ? 3 : Math.max(2, Math.round(width / 3.2)));
    const winSpacing = W / (winsPerFloor + 0.6);
    const winW = winSpacing * 0.45;
    const winH = floorH * 0.52;

    for (let floor = 0; floor < stories - 1; floor++) {
      const floorTop = floor * floorH + corniceH;
      const winTop = floorTop + (floorH - winH) * 0.45;

      for (let wi = 0; wi < winsPerFloor; wi++) {
        const winCx = (wi + 0.8) * winSpacing;

        // Arched top for romanesque
        if (style.windows === 'romanesque_arched') {
          ctx.fillStyle = trim;
          ctx.beginPath();
          ctx.arc(winCx, winTop, winW/2 + 3, Math.PI, 0);
          ctx.fill();
        }

        // Sill
        ctx.fillStyle = trim;
        ctx.fillRect(winCx - winW/2 - 3, winTop + winH, winW + 6, 4);

        // Lintel
        ctx.fillStyle = trim;
        ctx.fillRect(winCx - winW/2 - 2, winTop - 4, winW + 4, 4);

        // Frame
        ctx.fillStyle = trim;
        ctx.fillRect(winCx - winW/2 - 1.5, winTop, winW + 3, winH);

        // Glass — gradient with sky reflection
        const g = ctx.createLinearGradient(winCx - winW/2, winTop, winCx + winW/2, winTop + winH);
        g.addColorStop(0, '#1e3a5a');
        g.addColorStop(0.3, '#2a5080');
        g.addColorStop(0.7, '#1a3a60');
        g.addColorStop(1, '#152a45');
        ctx.fillStyle = g;
        ctx.fillRect(winCx - winW/2, winTop + 1, winW, winH - 2);

        // Sky reflection (diagonal highlight)
        ctx.globalAlpha = 0.2;
        const rg = ctx.createLinearGradient(winCx - winW/2, winTop, winCx + winW/3, winTop + winH * 0.6);
        rg.addColorStop(0, '#a0d4f0');
        rg.addColorStop(0.4, '#70b0d8');
        rg.addColorStop(1, 'transparent');
        ctx.fillStyle = rg;
        ctx.fillRect(winCx - winW/2, winTop + 1, winW, winH - 2);
        ctx.globalAlpha = 1.0;

        // Mullion (vertical divider)
        ctx.fillStyle = trim;
        ctx.fillRect(winCx - 0.8, winTop + 1, 1.6, winH - 2);

        // Horizontal mullion for multi-pane
        if (winH > 30) {
          ctx.fillRect(winCx - winW/2, winTop + winH * 0.5, winW, 1.2);
        }
        ctx.globalAlpha = 1.0;
      }
    }
  }

  // === GROUND FLOOR ===
  const gfTop = (stories - 1) * floorH + (signage ? floorH * 0.22 : corniceH + 2);
  const gfBottom = H - 4;
  const gfH = gfBottom - gfTop;
  const groundType = style.ground_floor || 'storefront';

  // --- Entrance doors ---
  const doorH = gfH * 0.85;
  const doorTop = gfBottom - doorH;

  for (const ent of entrances) {
    const cx = ent.t * W;

    // Recess shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(cx - doorW/2 - 4, doorTop - 4, doorW + 8, doorH + 5);

    // Frame
    ctx.fillStyle = style.accent || '#3a3a3a';
    ctx.fillRect(cx - doorW/2 - 2, doorTop - 2, doorW + 4, doorH + 3);

    // Door glass
    const dg = ctx.createLinearGradient(cx - doorW/2, doorTop, cx + doorW/2, doorTop + doorH);
    dg.addColorStop(0, '#2a3d55');
    dg.addColorStop(0.4, '#3a5a78');
    dg.addColorStop(1, '#223548');
    ctx.fillStyle = dg;
    ctx.fillRect(cx - doorW/2, doorTop, doorW, doorH);

    // Handle
    ctx.fillStyle = '#c8a850';
    ctx.fillRect(cx + doorW * 0.25, doorTop + doorH * 0.42, 2.5, doorH * 0.14);

    // Transom bar
    ctx.fillStyle = style.accent || '#3a3a3a';
    ctx.fillRect(cx - doorW/2, doorTop + doorH * 0.12, doorW, 2);
  }

  // --- Storefront glass or traditional windows ---
  if (groundType === 'full_glass' || groundType === 'storefront') {
    const glassTop = doorTop + (groundType === 'full_glass' ? 0 : gfH * 0.08);
    const glassH = groundType === 'full_glass' ? doorH : gfH * 0.7;
    const glassBottom = glassTop + glassH;

    // Divide into panes, skip entrance zones
    const numPanes = Math.max(2, Math.round(width / 3.5));
    const paneSpacing = W / numPanes;
    const paneW = paneSpacing * 0.82;

    for (let p = 0; p < numPanes; p++) {
      const cx = (p + 0.5) * paneSpacing;
      if (inEntranceZone(cx)) continue;

      // Bulkhead below
      if (groundType === 'storefront') {
        ctx.fillStyle = style.accent || '#2a2a2a';
        ctx.fillRect(cx - paneW/2, glassBottom, paneW, gfBottom - glassBottom - 2);
      }

      // Frame
      ctx.fillStyle = style.accent || '#2a2a2a';
      ctx.fillRect(cx - paneW/2 - 2, glassTop - 2, paneW + 4, glassH + 4);

      // Glass with warm interior glow
      const sg = ctx.createLinearGradient(cx - paneW/2, glassTop, cx + paneW/2, glassBottom);
      sg.addColorStop(0, '#1a3050');
      sg.addColorStop(0.3, '#254565');
      sg.addColorStop(0.7, '#1d3855');
      sg.addColorStop(1, '#152d45');
      ctx.fillStyle = sg;
      ctx.fillRect(cx - paneW/2, glassTop, paneW, glassH);

      // Interior warmth (subtle amber glow from inside)
      ctx.globalAlpha = 0.12;
      const ig = ctx.createRadialGradient(cx, glassTop + glassH * 0.6, 0, cx, glassTop + glassH * 0.6, paneW * 0.6);
      ig.addColorStop(0, '#f0c878');
      ig.addColorStop(0.6, '#a08040');
      ig.addColorStop(1, 'transparent');
      ctx.fillStyle = ig;
      ctx.fillRect(cx - paneW/2, glassTop, paneW, glassH);

      // Sky reflection (top portion)
      ctx.globalAlpha = 0.15;
      const rg2 = ctx.createLinearGradient(cx - paneW/3, glassTop, cx + paneW/4, glassTop + glassH * 0.4);
      rg2.addColorStop(0, '#a0d4f0');
      rg2.addColorStop(1, 'transparent');
      ctx.fillStyle = rg2;
      ctx.fillRect(cx - paneW/2, glassTop, paneW, glassH * 0.5);
      ctx.globalAlpha = 1.0;
    }
  } else {
    // Traditional smaller windows
    const numWins = Math.max(1, Math.round(width / 4.5));
    const spacing = W / (numWins + 0.5);
    const gWinW = spacing * 0.4;
    const gWinH = gfH * 0.5;
    const gWinTop = gfTop + gfH * 0.2;

    for (let wi = 0; wi < numWins; wi++) {
      const cx = (wi + 0.75) * spacing;
      if (inEntranceZone(cx)) continue;

      ctx.fillStyle = trim;
      ctx.fillRect(cx - gWinW/2 - 2, gWinTop - 2, gWinW + 4, gWinH + 4);
      const wg = ctx.createLinearGradient(cx, gWinTop, cx, gWinTop + gWinH);
      wg.addColorStop(0, '#2a4565');
      wg.addColorStop(1, '#1f3550');
      ctx.fillStyle = wg;
      ctx.fillRect(cx - gWinW/2, gWinTop, gWinW, gWinH);
      ctx.fillStyle = trim;
      ctx.fillRect(cx - 0.8, gWinTop, 1.6, gWinH);
    }
  }

  // === AWNING ===
  const awning = style.awning;

  function drawScallopedValance(ctx, x0, x1, y, color) {
    const span = x1 - x0;
    const nSc = Math.max(3, Math.round(span / 14));
    const scW = span / nSc;
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let s = 0; s < nSc; s++) {
      const scx = x0 + (s + 0.5) * scW;
      ctx.arc(scx, y, scW / 2 * 0.88, 0, Math.PI);
    }
    ctx.fill();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    for (let s = 0; s < nSc; s++) {
      const scx = x0 + (s + 0.5) * scW;
      ctx.arc(scx, y + 1.5, scW / 2 * 0.88, 0, Math.PI);
    }
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  if (awning && entrances.length > 0) {
    const awningH = gfH * 0.18;
    const awningTop = doorTop - awningH - 4;
    const awningStyle = awning.style || 'flat';

    for (const ent of entrances) {
      const cx = ent.t * W;
      const aw = Math.min(exclusionRadius * 1.6, W * 0.45);
      const ax0 = cx - aw / 2, ax1 = cx + aw / 2;

      if (awningStyle === 'slope') {
        ctx.fillStyle = awning.color;
        ctx.beginPath();
        ctx.moveTo(ax0, awningTop);
        ctx.lineTo(ax1, awningTop);
        ctx.lineTo(ax1 - 4, awningTop + awningH);
        ctx.lineTo(ax0 + 4, awningTop + awningH);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(ax0, awningTop, aw, 2);
        drawScallopedValance(ctx, ax0 + 4, ax1 - 4, awningTop + awningH, awning.color);
      } else if (awningStyle === 'striped') {
        ctx.fillStyle = awning.color;
        ctx.fillRect(ax0, awningTop, aw, awningH);
        const stripeColor = awning.stripe_color || 'rgba(255,255,255,0.45)';
        const strW = Math.max(5, aw / 10);
        ctx.fillStyle = stripeColor;
        for (let sx = ax0; sx < ax1; sx += strW * 2) {
          ctx.fillRect(sx, awningTop, strW, awningH);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(ax0, awningTop, aw, 2);
        drawScallopedValance(ctx, ax0, ax1, awningTop + awningH, awning.color);
      } else {
        // Flat awning
        ctx.fillStyle = awning.color;
        ctx.fillRect(ax0, awningTop, aw, awningH);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(ax0, awningTop, aw, 2);
        drawScallopedValance(ctx, ax0, ax1, awningTop + awningH, awning.color);
      }
    }
  } else if (awning && entrances.length === 0) {
    // Full-width awning when no specific entrance on this wall
    const awningH = gfH * 0.15;
    const awningTop = gfTop - awningH;
    const ax0 = W * 0.05, ax1 = W * 0.95;
    const awningStyle = awning.style || 'flat';
    if (awningStyle === 'striped') {
      ctx.fillStyle = awning.color;
      ctx.fillRect(ax0, awningTop, ax1 - ax0, awningH);
      const strW = Math.max(5, (ax1 - ax0) / 12);
      ctx.fillStyle = awning.stripe_color || 'rgba(255,255,255,0.45)';
      for (let sx = ax0; sx < ax1; sx += strW * 2) {
        ctx.fillRect(sx, awningTop, strW, awningH);
      }
    } else {
      ctx.fillStyle = awning.color;
      ctx.fillRect(ax0, awningTop, ax1 - ax0, awningH);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(ax0, awningTop, ax1 - ax0, 2);
    }
    drawScallopedValance(ctx, ax0, ax1, awningTop + awningH, awning.color);
  }

  // === BASE/PLINTH ===
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(0, H - 4, W, 4);

  // === AMBIENT OCCLUSION ===
  // Bottom edge darkening (ground contact shadow)
  const aoBottom = ctx.createLinearGradient(0, H - 20, 0, H);
  aoBottom.addColorStop(0, 'transparent');
  aoBottom.addColorStop(1, 'rgba(0,0,0,0.08)');
  ctx.fillStyle = aoBottom;
  ctx.fillRect(0, H - 20, W, 20);

  // Under-cornice shadow
  const aoCornice = ctx.createLinearGradient(0, corniceH, 0, corniceH + 12);
  aoCornice.addColorStop(0, 'rgba(0,0,0,0.06)');
  aoCornice.addColorStop(1, 'transparent');
  ctx.fillStyle = aoCornice;
  ctx.fillRect(0, corniceH, W, 12);

  const tex = new THREE.CanvasTexture(canvas2d);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ─── Gable / pitched roof builder ────────────────────────────────────────────

function buildGableRoof(footprintM, baseH, ridgeH, roofMat) {
  // OBB: find longest edge → building long axis
  const n = footprintM.length;
  let longestLen = 0, angle = 0;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = footprintM[j][0] - footprintM[i][0];
    const dz = footprintM[j][1] - footprintM[i][1];
    const len = Math.sqrt(dx*dx + dz*dz);
    if (len > longestLen) { longestLen = len; angle = Math.atan2(dz, dx); }
  }
  const axX = Math.cos(angle), axZ = Math.sin(angle);  // long axis
  const ayX = -axZ,            ayZ = axX;               // short axis

  let cx = 0, cz = 0;
  for (const p of footprintM) { cx += p[0]; cz += p[1]; }
  cx /= n; cz /= n;

  let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
  for (const p of footprintM) {
    const dx = p[0] - cx, dz = p[1] - cz;
    const u = dx * axX + dz * axZ;
    const v = dx * ayX + dz * ayZ;
    minU = Math.min(minU, u); maxU = Math.max(maxU, u);
    minV = Math.min(minV, v); maxV = Math.max(maxV, v);
  }

  function w(u, v) { return [cx + u*axX + v*ayX, cz + u*axZ + v*ayZ]; }

  const [e0x, e0z] = w(minU, minV); // eave corner — long/near
  const [e1x, e1z] = w(maxU, minV); // eave corner — long/far
  const [e2x, e2z] = w(maxU, maxV); // eave corner — far/back
  const [e3x, e3z] = w(minU, maxV); // eave corner — near/back
  const midV = (minV + maxV) / 2;
  const [r0x, r0z] = w(minU, midV); // ridge start
  const [r1x, r1z] = w(maxU, midV); // ridge end
  const ry = baseH + ridgeH;

  const pos = [];
  function tri(ax, ay, az, bx, by, bz, cx2, cy, cz) {
    pos.push(ax, ay, az, bx, by, bz, cx2, cy, cz);
  }
  // Front slope (minV eave → ridge)
  tri(e0x, baseH, e0z,  e1x, baseH, e1z,  r0x, ry, r0z);
  tri(e1x, baseH, e1z,  r1x, ry, r1z,     r0x, ry, r0z);
  // Back slope (maxV eave → ridge)
  tri(e2x, baseH, e2z,  e3x, baseH, e3z,  r1x, ry, r1z);
  tri(e3x, baseH, e3z,  r0x, ry, r0z,     r1x, ry, r1z);
  // Gable ends
  tri(e0x, baseH, e0z,  r0x, ry, r0z,     e3x, baseH, e3z);
  tri(e1x, baseH, e1z,  e2x, baseH, e2z,  r1x, ry, r1z);

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geom.computeVertexNormals();
  const mesh = new THREE.Mesh(geom, roofMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ─── Wall depth styles (arnis-inspired procedural 3D depth) ──────────────────

function _hashId(id) {
  let h = 5381;
  for (let i = 0; i < id.length; i++) h = (Math.imul(h, 31) + id.charCodeAt(i)) | 0;
  return h >>> 0;
}

function _varyColor(hex, seed, range) {
  range = range || 0.06;
  const h = _hashId(seed);
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const f = range * 255;
  const clamp = function(v) { return Math.max(0, Math.min(255, Math.round(v))); };
  return '#' + [
    clamp(r + ((h & 0xFF) / 255 - 0.5) * f),
    clamp(g + (((h >> 8) & 0xFF) / 255 - 0.5) * f),
    clamp(b + (((h >> 16) & 0xFF) / 255 - 0.5) * f)
  ].map(function(v) { return v.toString(16).padStart(2, '0'); }).join('');
}

function _buildingDepthStyle(bld) {
  const style = bld.style || {};
  const lf = style.landmark_features || {};
  const mat = style.material || '';
  const era = style.era || '';
  const arch = style.arch_style || '';
  const lfStyle = lf.style || '';
  const historicArch = ['neoclassical', 'romanesque', 'richardsonian_romanesque', 'victorian', 'art_deco', 'gothic_revival'];
  const historicEra = ['victorian', 'edwardian', 'interwar'];
  const historicLf = ['neoclassical', 'romanesque', 'victorian', 'art_deco'];
  if (historicArch.indexOf(arch) >= 0 || historicEra.indexOf(era) >= 0 || historicLf.indexOf(lfStyle) >= 0) return 'historicOrnate';
  if (mat === 'stone') return 'institutionalBands';
  if (era === 'contemporary' || style.ground_floor === 'storefront') return 'modernPillars';
  return 'subtlePilasters';
}

function addWallDepth(bld, group, style, mode) {
  if (mode === 'wireframe') return;
  const depthStyle = _buildingDepthStyle(bld);
  const baseColor = style.color || '#c8bca8';
  const accentColor = style.accent || style.color || '#a89880';
  const roughness = style.material === 'stone' ? 0.88 : 0.82;

  // OSM-sourced residential buildings get wider color range so adjacent houses read as distinct
  const colorRange = (style.source === 'osm') ? 0.18 : 0.06;
  const wallMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(_varyColor(baseColor, bld.id, colorRange)),
    roughness: roughness, metalness: 0.02
  });
  const accentMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(_varyColor(accentColor, bld.id + '_a', colorRange * 0.6)),
    roughness: roughness - 0.05, metalness: 0.02
  });

  for (let wi = 0; wi < bld.walls.length; wi++) {
    const wall = bld.walls[wi];
    if (!wall.is_exterior) continue;
    const v = wall.vertices;
    const x0 = v[0][0], z0 = v[0][2], x1 = v[1][0], z1 = v[1][2];
    const wallH = wall.height;
    const dx = x1 - x0, dz = z1 - z0;
    const wallLen = Math.sqrt(dx * dx + dz * dz);
    if (wallLen < 1.5) continue;
    const tx = dx / wallLen, tz = dz / wallLen;
    const nx = -tz, nz = tx;
    const rotY = Math.atan2(-tz, tx);

    // Place a wall-aligned box: tPos along wall from (x0,z0), yCenter in world Y
    const placeBox = function(tPos, yCenter, boxW, boxH, boxD, mat) {
      const geo = new THREE.BoxGeometry(boxW, boxH, boxD);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(
        x0 + tPos * tx + nx * (boxD / 2),
        yCenter,
        z0 + tPos * tz + nz * (boxD / 2)
      );
      mesh.rotation.y = rotY;
      mesh.castShadow = true;
      group.add(mesh);
    };

    // Full-width horizontal band at given y center
    const placeBand = function(yCenter, bandH, bandD, mat) {
      placeBox(wallLen / 2, yCenter, wallLen, bandH, bandD, mat);
    };

    if (depthStyle === 'subtlePilasters') {
      // Interior pilasters every ~4m (skip corners)
      const count = Math.max(1, Math.round(wallLen / 4.0));
      for (let i = 0; i <= count; i++) {
        const tPos = (wallLen / count) * i;
        if (tPos < 0.15 || tPos > wallLen - 0.15) continue;
        placeBox(tPos, wallH / 2, 0.18, wallH, 0.1, wallMat);
      }
      // Thin cornice cap
      placeBand(wallH - 0.15, 0.3, 0.12, accentMat);

    } else if (depthStyle === 'modernPillars') {
      // Pilasters every ~3.2m including corners
      const count = Math.max(1, Math.round(wallLen / 3.2));
      for (let i = 0; i <= count; i++) {
        const tPos = (wallLen / count) * i;
        placeBox(tPos, wallH / 2, 0.25, wallH, 0.18, wallMat);
      }
      // Horizontal band at each floor seam
      const stories = Math.max(1, Math.round(wallH / 3.5));
      const floorH = wallH / stories;
      for (let fl = 1; fl < stories; fl++) {
        placeBand(fl * floorH, 0.2, 0.1, accentMat);
      }
      // Bold cornice cap
      placeBand(wallH - 0.25, 0.5, 0.2, accentMat);

    } else if (depthStyle === 'historicOrnate') {
      // Pilasters every ~2.5m including corners
      const count = Math.max(1, Math.round(wallLen / 2.5));
      for (let i = 0; i <= count; i++) {
        const tPos = (wallLen / count) * i;
        placeBox(tPos, wallH / 2, 0.28, wallH, 0.2, wallMat);
      }
      // Sub-cornice decorative band
      placeBand(wallH - 1.01, 0.22, 0.15, accentMat);
      // Bold cornice cap
      placeBand(wallH - 0.275, 0.55, 0.22, accentMat);

    } else if (depthStyle === 'institutionalBands') {
      // Corner pilasters only
      placeBox(0, wallH / 2, 0.4, wallH, 0.15, wallMat);
      placeBox(wallLen, wallH / 2, 0.4, wallH, 0.15, wallMat);
      // Floor bands
      const stories = Math.max(1, Math.round(wallH / 3.5));
      const floorH = wallH / stories;
      for (let fl = 1; fl < stories; fl++) {
        placeBand(fl * floorH, 0.18, 0.1, accentMat);
      }
      // Cornice cap
      placeBand(wallH - 0.225, 0.45, 0.18, accentMat);
    }
  }
}

let buildingGroups = [];
let currentMode = 'textured';

function createBuilding(bld, mode) {
  const group = new THREE.Group();
  group.userData = bld;

  const style = bld.style || {};

  const lf = style.landmark_features || {};

  // Primary wall: road-facing detection using wall bearing + road proximity/alignment.
  // This is scalable — works for any building without manual overrides.
  // Fall back to entrance scoring when no qualifying road is nearby.
  let primaryWallIdx = -1;
  if (typeof lf.primary_wall_idx === 'number') {
    primaryWallIdx = lf.primary_wall_idx;
  } else {
    const roads = (window._sceneData && window._sceneData.roads) || [];
    let bestRoadScore = 0;
    for (let i = 0; i < bld.walls.length; i++) {
      const w = bld.walls[i];
      if (!w.is_exterior || !w.bearing) continue;
      const bearingRad = w.bearing * Math.PI / 180;
      const wnx = Math.sin(bearingRad), wnz = Math.cos(bearingRad);
      const v = w.vertices;
      const wcx = (v[0][0] + v[1][0]) / 2, wcz = (v[0][2] + v[1][2]) / 2;
      // Score this wall by proximity + alignment to nearby roads
      let wallScore = 0;
      for (const road of roads) {
        if (road.subclass === 'parking_aisle') continue;
        const pts = road.points;
        for (let ri = 0; ri < pts.length - 1; ri++) {
          const ax = pts[ri][0], az = pts[ri][1];
          const bx = pts[ri+1][0], bz = pts[ri+1][1];
          const ddx = bx-ax, ddz = bz-az;
          const len2 = ddx*ddx + ddz*ddz;
          if (len2 < 0.01) continue;
          let t = ((wcx-ax)*ddx + (wcz-az)*ddz) / len2;
          t = Math.max(0, Math.min(1, t));
          const px = ax + t*ddx, pz = az + t*ddz;
          const rx = px - wcx, rz = pz - wcz;
          const dist = Math.sqrt(rx*rx + rz*rz);
          if (dist < 1 || dist > 35) continue;
          const align = (wnx * rx + wnz * rz) / dist; // +1 = wall faces road
          if (align < 0.25) continue;
          // Weight by road class: named residential/secondary roads score higher
          const classWeight = road.class === 'residential' || road.class === 'secondary' ? 2.0
            : road.class === 'service' ? 0.3
            : road.class === 'footway' ? 1.5 : 1.0;
          const s = (align * classWeight) / dist;
          if (s > wallScore) wallScore = s;
        }
      }
      if (wallScore > bestRoadScore) { bestRoadScore = wallScore; primaryWallIdx = i; }
    }
    // Fallback: entrance count × 10000 + length
    if (primaryWallIdx < 0) {
      let primaryScore = -1;
      for (let i = 0; i < bld.walls.length; i++) {
        const w = bld.walls[i];
        if (!w.is_exterior) continue;
        const score = (w.entrances || []).length * 10000 + w.length;
        if (score > primaryScore) { primaryScore = score; primaryWallIdx = i; }
      }
    }
  }

  for (let wallIdx = 0; wallIdx < bld.walls.length; wallIdx++) {
    const wall = bld.walls[wallIdx];
    const positions = new Float32Array(wall.vertices.flat());
    const uvs = new Float32Array(wall.uvs.flat());

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geom.computeVertexNormals();

    const matRoughness = style.material === 'glass' ? 0.1 :
      style.material === 'stucco' ? 0.92 :
      style.material === 'stone' ? 0.88 :
      style.material && style.material.includes('brick') ? 0.85 : 0.8;
    const matMetalness = style.material === 'glass' ? 0.1 :
      style.material === 'metal' ? 0.6 : 0.02;

    let material;

    if (mode === 'wireframe') {
      material = new THREE.MeshBasicMaterial({
        color: wall.is_exterior ? 0x3b82f6 : 0xc9bdb1,
        wireframe: true, opacity: wall.is_exterior ? 0.6 : 0.3, transparent: true,
        side: THREE.DoubleSide
      });
    } else if (!wall.is_exterior) {
      material = new THREE.MeshStandardMaterial({
        color: 0xc9bdb1, roughness: 0.95, metalness: 0,
        side: THREE.DoubleSide
      });
    } else if (mode === 'textured' || mode === 'color') {
      const facadeTex = createProceduralFacade(style, wall, wallIdx === primaryWallIdx, bld.id);
      material = new THREE.MeshStandardMaterial({
        map: facadeTex, roughness: matRoughness, metalness: matMetalness,
        side: THREE.DoubleSide
      });
    }

    const mesh = new THREE.Mesh(geom, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
  }

  // 3D Awnings
  if (mode !== 'wireframe' && style.awning) {
    const awningColor = new THREE.Color(style.awning.color);
    const awningDepth = 1.8;
    const awningDroop = 0.4;

    for (const wall of bld.walls) {
      if (!wall.is_exterior) continue;
      const ents = wall.entrances || [];
      if (ents.length === 0 && wall.length < 4) continue;

      const v = wall.vertices;
      const x0 = v[0][0], z0 = v[0][2], x1 = v[1][0], z1 = v[1][2];
      const h = wall.height;
      const dx = x1 - x0, dz = z1 - z0;
      const len = Math.sqrt(dx*dx + dz*dz);
      if (len < 2) continue;

      // Normal direction (outward)
      const nx = -dz / len, nz = dx / len;
      const bldStories = style.stories || Math.max(1, Math.round(h / 3.5));
      const floorH3d = h / bldStories;
      const awningTop = floorH3d * 0.88;  // just below top of ground floor
      const awningBot = awningTop - awningDroop;

      // Place awning per entrance, or full-width if none
      const spans = ents.length > 0
        ? ents.map(e => [Math.max(0.05, e.t - 0.2), Math.min(0.95, e.t + 0.2)])
        : [[0.08, 0.92]];

      for (const [tStart, tEnd] of spans) {
        const ax0 = x0 + tStart * dx, az0 = z0 + tStart * dz;
        const ax1 = x0 + tEnd * dx, az1 = z0 + tEnd * dz;
        const bx0 = ax0 + nx * awningDepth, bz0 = az0 + nz * awningDepth;
        const bx1 = ax1 + nx * awningDepth, bz1 = az1 + nz * awningDepth;

        const awningVerts = new Float32Array([
          ax0, awningTop, az0, ax1, awningTop, az1, bx1, awningBot, bz1,
          ax0, awningTop, az0, bx1, awningBot, bz1, bx0, awningBot, bz0
        ]);
        const awningGeom = new THREE.BufferGeometry();
        awningGeom.setAttribute('position', new THREE.BufferAttribute(awningVerts, 3));
        awningGeom.computeVertexNormals();
        const awningMat = new THREE.MeshStandardMaterial({
          color: awningColor, roughness: 0.6, metalness: 0, side: THREE.DoubleSide
        });
        const awningMesh = new THREE.Mesh(awningGeom, awningMat);
        awningMesh.castShadow = true;
        group.add(awningMesh);
      }
    }
  }

  // Arnis-inspired wall depth features
  addWallDepth(bld, group, style, mode);

  // Roof — flat or pitched based on style.roof_type
  let roofMat;
  if (mode === 'wireframe') {
    roofMat = new THREE.MeshBasicMaterial({
      color: bld.has_mapillary ? 0x3b82f6 : 0xc9bdb1,
      wireframe: true, opacity: 0.6, transparent: true,
      side: THREE.DoubleSide
    });
  } else {
    // Residential pitched roofs get varied tile colors; others use NAIP-derived roof_color
    let roofColor = bld.roof_color || '#d9d3c8';
    if ((style.roof_type === 'pitched' || style.roof_type === 'shed') && style.source === 'osm') {
      const roofPalette = ['#7a3a2a', '#5c3d1e', '#607b8b', '#8b5e3c', '#4a4a4a', '#6b3a2a'];
      roofColor = roofPalette[_hashId(bld.id) % roofPalette.length];
    }
    roofMat = new THREE.MeshStandardMaterial({
      color: _varyColor(roofColor, bld.id + '_r', 0.08),
      roughness: 0.88, metalness: 0.04,
      side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
    });
  }

  if ((style.roof_type === 'pitched' || style.roof_type === 'shed') && bld.footprint_m && bld.footprint_m.length >= 3) {
    const ridgeH = style.stories <= 1 ? 2.0 : 2.8;
    const roofMesh = buildGableRoof(bld.footprint_m, bld.height, ridgeH, roofMat);
    group.add(roofMesh);
  } else {
    const roofPositions = [];
    for (const tri of bld.roof) {
      for (const v of tri) roofPositions.push(v[0], v[1], v[2]);
    }
    const roofGeom = new THREE.BufferGeometry();
    roofGeom.setAttribute('position', new THREE.Float32BufferAttribute(roofPositions, 3));
    roofGeom.computeVertexNormals();
    const roofMesh = new THREE.Mesh(roofGeom, roofMat);
    roofMesh.castShadow = true;
    roofMesh.receiveShadow = true;
    group.add(roofMesh);
  }

  // Roof equipment from NAIP analysis — aligned to building's longest edge
  if (mode !== 'wireframe' && bld.roof_features) {
    const fp = bld.footprint_m;
    const h = bld.height;
    const cx = bld.centroid_m[0], cy = bld.centroid_m[1];

    // Point-in-polygon test (2D, x/z plane)
    function insideFootprint(px, pz) {
      let inside = false;
      for (let i = 0, j = fp.length - 1; i < fp.length; j = i++) {
        const xi = fp[i][0], zi = fp[i][1];
        const xj = fp[j][0], zj = fp[j][1];
        if ((zi > pz) !== (zj > pz) && (px < (xj - xi) * (pz - zi) / (zj - zi) + xi)) {
          inside = !inside;
        }
      }
      return inside;
    }

    // Find longest edge to determine building orientation
    let longestLen = 0, buildingAngle = 0;
    for (let i = 0; i < fp.length; i++) {
      const j = (i + 1) % fp.length;
      const dx = fp[j][0] - fp[i][0], dz = fp[j][1] - fp[i][1];
      const len = Math.sqrt(dx*dx + dz*dz);
      if (len > longestLen) {
        longestLen = len;
        buildingAngle = Math.atan2(dz, dx);
      }
    }

    // Local axes aligned to building
    const axX = Math.cos(buildingAngle), axZ = Math.sin(buildingAngle);
    const ayX = -Math.sin(buildingAngle), ayZ = Math.cos(buildingAngle);

    // Project footprint onto local axes to get oriented extents
    let localMinX = Infinity, localMaxX = -Infinity;
    let localMinY = Infinity, localMaxY = -Infinity;
    for (const p of fp) {
      const dx = p[0] - cx, dz = p[1] - cy;
      const lx = dx * axX + dz * axZ;
      const ly = dx * ayX + dz * ayZ;
      localMinX = Math.min(localMinX, lx); localMaxX = Math.max(localMaxX, lx);
      localMinY = Math.min(localMinY, ly); localMaxY = Math.max(localMaxY, ly);
    }
    const fW = localMaxX - localMinX, fH = localMaxY - localMinY;

    // Helper: local coords to world
    function toWorld(lx, ly) {
      return [cx + lx * axX + ly * ayX, cy + lx * axZ + ly * ayZ];
    }

    for (const feat of bld.roof_features) {
      if (feat.type === 'solar_panels') {
        const panelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.3, metalness: 0.4 });
        const panelW = 1.6, panelH = 1.0;
        const cols = Math.max(2, Math.round(Math.sqrt(feat.coverage * fW * fH / (panelW * panelH))));
        const rows = Math.max(1, Math.round(cols * 0.6));
        const spacingX = fW * 0.55 / Math.max(1, cols - 1);
        const spacingY = fH * 0.35 / Math.max(1, rows - 1);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const lx = -fW * 0.275 + c * spacingX;
            const ly = -fH * 0.175 + r * spacingY;
            const [wx, wz] = toWorld(lx, ly);
            if (!insideFootprint(wx, wz)) continue;
            const panel = new THREE.Mesh(new THREE.BoxGeometry(panelW, 0.08, panelH), panelMat);
            panel.position.set(wx, h + 0.15, wz);
            panel.rotation.y = -buildingAngle;
            panel.castShadow = true;
            group.add(panel);
          }
        }
      }

      if (feat.type === 'hvac_units') {
        const hvacMat = new THREE.MeshStandardMaterial({ color: 0xd0d0d0, roughness: 0.6, metalness: 0.3 });
        const count = Math.max(1, Math.round(feat.coverage * 5));
        const gridCols = Math.ceil(Math.sqrt(count));
        const gridRows = Math.ceil(count / gridCols);
        let placed = 0;
        for (let r = 0; r < gridRows && placed < count; r++) {
          for (let c = 0; c < gridCols && placed < count; c++) {
            const lx = (c / (gridCols + 1) - 0.5) * fW * 0.5 + fW * 0.1;
            const ly = (r / (gridRows + 1) - 0.5) * fH * 0.5;
            const [wx, wz] = toWorld(lx, ly);
            if (!insideFootprint(wx, wz)) { placed++; continue; }
            const size = 0.9 + placed * 0.1 % 0.5;
            const unitH = 0.5 + placed * 0.07 % 0.3;
            const unit = new THREE.Mesh(new THREE.BoxGeometry(size, unitH, size * 0.8), hvacMat);
            unit.position.set(wx, h + unitH / 2, wz);
            unit.rotation.y = -buildingAngle;
            unit.castShadow = true;
            group.add(unit);
            placed++;
          }
        }
      }

      if (feat.type === 'vegetation') {
        const vegMat = new THREE.MeshStandardMaterial({ color: 0x4a8a4a, roughness: 0.9 });
        const count = Math.max(2, Math.round(feat.coverage * 8));
        for (let i = 0; i < count; i++) {
          const lx = (i / count - 0.5) * fW * 0.4;
          const ly = ((i * 0.618) % 1 - 0.5) * fH * 0.4;
          const [wx, wz] = toWorld(lx, ly);
          if (!insideFootprint(wx, wz)) continue;
          const veg = new THREE.Mesh(new THREE.SphereGeometry(0.5 + (i % 3) * 0.15, 6, 4), vegMat);
          veg.position.set(wx, h + 0.2, wz);
          veg.scale.y = 0.3;
          group.add(veg);
        }
      }

      if (feat.type === 'light_membrane') {
        const parapetMat = new THREE.MeshStandardMaterial({ color: 0x888880, roughness: 0.8 });
        const parapetH = 0.3;
        for (let i = 0; i < fp.length; i++) {
          const j = (i + 1) % fp.length;
          const x0 = fp[i][0], z0 = fp[i][1];
          const x1 = fp[j][0], z1 = fp[j][1];
          const len = Math.sqrt((x1-x0)**2 + (z1-z0)**2);
          if (len < 1) continue;
          const midX = (x0+x1)/2, midZ = (z0+z1)/2;
          const parapet = new THREE.Mesh(new THREE.BoxGeometry(len, parapetH, 0.15), parapetMat);
          parapet.position.set(midX, h + parapetH/2, midZ);
          parapet.rotation.y = -Math.atan2(z1-z0, x1-x0);
          group.add(parapet);
        }
      }
    }
  }

  // Landmark features — towers, clocks, stepped massing
  if (mode !== 'wireframe' && style.landmark_features) {
    const lf = style.landmark_features;
    const h = bld.height;
    const cx = bld.centroid_m[0], cz = bld.centroid_m[1];
    const fp = bld.footprint_m;

    // Building orientation (longest edge)
    let longestLen = 0, buildingAngle = 0;
    for (let i = 0; i < fp.length; i++) {
      const j = (i + 1) % fp.length;
      const dx = fp[j][0] - fp[i][0], dz = fp[j][1] - fp[i][1];
      const len = Math.sqrt(dx*dx + dz*dz);
      if (len > longestLen) { longestLen = len; buildingAngle = Math.atan2(dz, dx); }
    }

    // Oriented footprint extents
    const axX = Math.cos(buildingAngle), axZ = Math.sin(buildingAngle);
    const ayX = -Math.sin(buildingAngle), ayZ = Math.cos(buildingAngle);
    let localMinX = Infinity, localMaxX = -Infinity;
    let localMinY = Infinity, localMaxY = -Infinity;
    for (const p of fp) {
      const dx = p[0] - cx, dz = p[1] - cz;
      const lx = dx * axX + dz * axZ;
      const ly = dx * ayX + dz * ayZ;
      localMinX = Math.min(localMinX, lx); localMaxX = Math.max(localMaxX, lx);
      localMinY = Math.min(localMinY, ly); localMaxY = Math.max(localMaxY, ly);
    }
    const fW = localMaxX - localMinX, fD = localMaxY - localMinY;

    const tierMat = new THREE.MeshStandardMaterial({
      color: style.color || '#d4b896', roughness: 0.7, metalness: 0.05
    });

    // NAIP-derived roof profile (multi-level stepped massing)
    if (bld.roof_profile) {
      for (const level of bld.roof_profile) {
        const tierW = fW * (level.fraction != null ? level.fraction : 1.0);
        const tierD = fD * (level.fraction != null ? level.fraction : 1.0);
        const tierH = level.height_add;
        const tier = new THREE.Mesh(
          new THREE.BoxGeometry(tierW, tierH, tierD),
          tierMat
        );
        tier.position.set(cx, h + tierH / 2, cz);
        tier.rotation.y = -buildingAngle;
        tier.castShadow = true;
        tier.receiveShadow = true;
        group.add(tier);
      }

      // Clock on the tower tier (highest level)
      if (lf.clock) {
        const topLevel = bld.roof_profile[bld.roof_profile.length - 1];
        const towerW = fW * topLevel.fraction;
        const towerTop = h + topLevel.height_add;
        const clockR = towerW * 0.3;
        const clockCanvas = document.createElement('canvas');
        clockCanvas.width = 128; clockCanvas.height = 128;
        const cctx = clockCanvas.getContext('2d');
        cctx.fillStyle = '#f5f0e0';
        cctx.beginPath(); cctx.arc(64, 64, 60, 0, Math.PI * 2); cctx.fill();
        cctx.strokeStyle = '#4a3a2a'; cctx.lineWidth = 4;
        cctx.stroke();
        for (let hr = 0; hr < 12; hr++) {
          const a = hr * Math.PI / 6 - Math.PI / 2;
          cctx.beginPath();
          cctx.moveTo(64 + Math.cos(a) * 48, 64 + Math.sin(a) * 48);
          cctx.lineTo(64 + Math.cos(a) * 54, 64 + Math.sin(a) * 54);
          cctx.strokeStyle = '#2a2a2a'; cctx.lineWidth = 3; cctx.stroke();
        }
        cctx.strokeStyle = '#1a1a1a'; cctx.lineWidth = 3;
        cctx.beginPath(); cctx.moveTo(64, 64); cctx.lineTo(64, 28); cctx.stroke();
        cctx.beginPath(); cctx.moveTo(64, 64); cctx.lineTo(84, 52); cctx.stroke();

        const clockTex = new THREE.CanvasTexture(clockCanvas);
        clockTex.colorSpace = THREE.SRGBColorSpace;
        const clockMat = new THREE.MeshStandardMaterial({ map: clockTex, roughness: 0.3 });
        const clockGeom = new THREE.CircleGeometry(clockR, 24);

        const clockY = towerTop - topLevel.height_add * 0.35;
        const offset = towerW / 2 + 0.05;

        // Place clocks on 4 faces of tower, each facing outward
        const dirs = [
          [axX, axZ],   // +long axis
          [-axX, -axZ], // -long axis
          [ayX, ayZ],   // +short axis
          [-ayX, -ayZ], // -short axis
        ];
        for (let ci = 0; ci < 4; ci++) {
          const [nx, nz] = dirs[ci];
          const clock = new THREE.Mesh(ci === 0 ? clockGeom : clockGeom.clone(), clockMat);
          clock.position.set(cx + nx * offset, clockY, cz + nz * offset);
          clock.rotation.y = Math.atan2(nx, nz);
          group.add(clock);
        }
      }
    } else if (lf.tower) {
      // Fallback: generic tower for buildings without NAIP roof profile
      const towerW = Math.min(longestLen * 0.25, 5);
      const towerH = h * 0.5;
      const tower = new THREE.Mesh(new THREE.BoxGeometry(towerW, towerH, towerW), tierMat);
      tower.position.set(cx, h + towerH / 2, cz);
      tower.rotation.y = -buildingAngle;
      tower.castShadow = true;
      group.add(tower);

      if (lf.tiered) {
        const steps = 2;
        for (let s = 1; s <= steps; s++) {
          const stepFrac = 0.7 - s * 0.15;
          const stepW = longestLen * stepFrac;
          const stepD = (longestLen * 0.4) * stepFrac;
          const stepH = h * 0.12;
          const stepY = h - s * stepH * 1.5;
          const step = new THREE.Mesh(new THREE.BoxGeometry(stepW, stepH, stepD), tierMat);
          step.position.set(cx, stepY, cz);
          step.rotation.y = -buildingAngle;
          step.castShadow = true;
          group.add(step);
        }
      }

      if (lf.clock) {
        const towerTop = h + h * 0.5;
        const clockR = towerW * 0.35;
        const clockCanvas = document.createElement('canvas');
        clockCanvas.width = 128; clockCanvas.height = 128;
        const cctx = clockCanvas.getContext('2d');
        cctx.fillStyle = '#f5f0e0';
        cctx.beginPath(); cctx.arc(64, 64, 60, 0, Math.PI * 2); cctx.fill();
        cctx.strokeStyle = '#4a3a2a'; cctx.lineWidth = 4; cctx.stroke();
        for (let hr = 0; hr < 12; hr++) {
          const a = hr * Math.PI / 6 - Math.PI / 2;
          cctx.beginPath();
          cctx.moveTo(64 + Math.cos(a) * 48, 64 + Math.sin(a) * 48);
          cctx.lineTo(64 + Math.cos(a) * 54, 64 + Math.sin(a) * 54);
          cctx.strokeStyle = '#2a2a2a'; cctx.lineWidth = 3; cctx.stroke();
        }
        cctx.strokeStyle = '#1a1a1a'; cctx.lineWidth = 3;
        cctx.beginPath(); cctx.moveTo(64, 64); cctx.lineTo(64, 28); cctx.stroke();
        cctx.beginPath(); cctx.moveTo(64, 64); cctx.lineTo(84, 52); cctx.stroke();
        const clockTex = new THREE.CanvasTexture(clockCanvas);
        clockTex.colorSpace = THREE.SRGBColorSpace;
        const clockMat = new THREE.MeshStandardMaterial({ map: clockTex, roughness: 0.3 });
        const clockGeom = new THREE.CircleGeometry(clockR, 24);
        const clockY = towerTop * 0.85;
        const offset = towerW / 2 + 0.05;

        for (let side = 0; side < 4; side++) {
          const a = buildingAngle + side * Math.PI / 2;
          const nx = Math.cos(a), nz = Math.sin(a);
          const c = new THREE.Mesh(side === 0 ? clockGeom : clockGeom.clone(), clockMat);
          c.position.set(cx + nx * offset, clockY, cz + nz * offset);
          c.rotation.y = Math.atan2(nx, nz);
          group.add(c);
        }
      }
    }

    // Columns on facade
    if (lf.columns && !lf.tower) {
      const colMat = new THREE.MeshStandardMaterial({ color: '#e8e0d8', roughness: 0.6, metalness: 0.05 });
      // Find street-facing wall
      let bestWall = bld.walls[0];
      for (const w of bld.walls) {
        if (w.is_exterior && w.length > bestWall.length) bestWall = w;
      }
      const v = bestWall.vertices;
      const wx0 = v[0][0], wz0 = v[0][2], wx1 = v[1][0], wz1 = v[1][2];
      const wdx = wx1 - wx0, wdz = wz1 - wz0;
      const wlen = Math.sqrt(wdx*wdx + wdz*wdz);
      const wnx = -wdz / wlen, wnz = wdx / wlen;
      // Outward normal
      const testX = (wx0+wx1)/2 + wnx, testZ = (wz0+wz1)/2 + wnz;
      const dTest = (testX-cx)*(testX-cx) + (testZ-cz)*(testZ-cz);
      const dMid = ((wx0+wx1)/2-cx)*((wx0+wx1)/2-cx) + ((wz0+wz1)/2-cz)*((wz0+wz1)/2-cz);
      const nDir = dTest > dMid ? 1 : -1;

      const numCols = Math.max(2, Math.round(wlen / 4));
      const colH = h * 0.85;
      const colR = 0.18;
      for (let ci = 0; ci < numCols; ci++) {
        const t = (ci + 0.5) / numCols;
        const px = wx0 + t * wdx + wnx * nDir * 0.4;
        const pz = wz0 + t * wdz + wnz * nDir * 0.4;
        const col = new THREE.Mesh(new THREE.CylinderGeometry(colR * 0.8, colR, colH, 8), colMat);
        col.position.set(px, colH / 2, pz);
        col.castShadow = true;
        group.add(col);
      }
    }

    // Pediment / stepped gable
    if (lf.pediment && !lf.tower) {
      const pedMat = new THREE.MeshStandardMaterial({
        color: style.accent || style.color || '#d4c5a9', roughness: 0.7
      });
      let bestWall = bld.walls[0];
      for (const w of bld.walls) {
        if (w.is_exterior && w.length > bestWall.length) bestWall = w;
      }
      const v = bestWall.vertices;
      const wmx = (v[0][0] + v[1][0]) / 2, wmz = (v[0][2] + v[1][2]) / 2;
      const pedW = bestWall.length * 0.4;
      const pedH = h * 0.2;
      const pedGeom = new THREE.BufferGeometry();
      const wdx = v[1][0] - v[0][0], wdz = v[1][2] - v[0][2];
      const wlen = Math.sqrt(wdx*wdx + wdz*wdz);
      const dirX = wdx / wlen, dirZ = wdz / wlen;

      // Triangle pediment
      const p0 = [wmx - dirX * pedW/2, h, wmz - dirZ * pedW/2];
      const p1 = [wmx + dirX * pedW/2, h, wmz + dirZ * pedW/2];
      const p2 = [wmx, h + pedH, wmz];
      const pedVerts = new Float32Array([
        p0[0], p0[1], p0[2], p1[0], p1[1], p1[2], p2[0], p2[1], p2[2]
      ]);
      pedGeom.setAttribute('position', new THREE.BufferAttribute(pedVerts, 3));
      pedGeom.computeVertexNormals();
      const ped = new THREE.Mesh(pedGeom, pedMat);
      ped.material.side = THREE.DoubleSide;
      ped.castShadow = true;
      group.add(ped);
    }
  }

  // Marquee — projecting canopy for theaters/cinemas
  if (mode !== 'wireframe' && lf.marquee) {
    const mWall = primaryWallIdx >= 0 ? bld.walls[primaryWallIdx] : null;
    if (mWall) {
      const v = mWall.vertices;
      const wx0 = v[0][0], wz0 = v[0][2], wx1 = v[1][0], wz1 = v[1][2];
      const wdx = wx1 - wx0, wdz = wz1 - wz0;
      const wlen = Math.sqrt(wdx * wdx + wdz * wdz);
      let nx = -wdz / wlen, nz = wdx / wlen;
      const bldCx = bld.centroid_m[0], bldCz = bld.centroid_m[1];

      // Use the building footprint projected onto the primary wall's frame.
      // This matches what a VLM sees: the whole building face as one image where
      // "center" means the center of the full visible facade width.
      const pRad = mWall.bearing * Math.PI / 180;
      const pNx = Math.sin(pRad), pNz = Math.cos(pRad);
      const pTx = pNz, pTz = -pNx; // tangent along facade
      let tangMin = Infinity, tangMax = -Infinity, normMax = -Infinity;
      for (const p of bld.footprint_m) {
        const tProj = (p[0] - bldCx) * pTx + (p[1] - bldCz) * pTz;
        const nProj = (p[0] - bldCx) * pNx + (p[1] - bldCz) * pNz;
        tangMin = Math.min(tangMin, tProj); tangMax = Math.max(tangMax, tProj);
        normMax = Math.max(normMax, nProj);
      }
      const totalLen = tangMax - tangMin;
      // Feature position 0.5 → facade center; honoured from VLM-derived marquee_position
      const marqFeatT = lf.marquee_position != null ? lf.marquee_position : 0.5;
      const tangPos = tangMin + marqFeatT * totalLen;
      // Position is at the facade face (normMax outward) at the given tangent offset
      const wallCx = bldCx + tangPos * pTx + normMax * pNx;
      const wallCz = bldCz + tangPos * pTz + normMax * pNz;

      // Ensure normal points away from building centroid
      if ((wallCx + nx - bldCx) ** 2 + (wallCz + nz - bldCz) ** 2 <
          (wallCx - bldCx) ** 2 + (wallCz - bldCz) ** 2) { nx = -nx; nz = -nz; }

      const wallAngle = Math.atan2(pTz, pTx);
      const marqW = totalLen * 0.88;
      const marqThick = 1.2;
      const marqDepth = 2.2;
      const marqY = 3.8;

      // Canopy — dark green like the real Boulder Theater canopy
      const canopyMat = new THREE.MeshStandardMaterial({ color: '#1a4a1a', roughness: 0.75 });

      // Front face canvas — "BOULDER" marquee sign
      const mCvs = document.createElement('canvas');
      mCvs.width = 512; mCvs.height = 64;
      const mCtx = mCvs.getContext('2d');
      mCtx.fillStyle = '#1a1a1a';
      mCtx.fillRect(0, 0, 512, 64);
      // Green border stripe
      mCtx.fillStyle = '#2a6a2a';
      mCtx.fillRect(0, 0, 512, 8);
      mCtx.fillRect(0, 56, 512, 8);
      // Lightbulbs along top and bottom edges
      mCtx.fillStyle = '#f8f040';
      for (let bx = 16; bx < 512; bx += 24) {
        mCtx.beginPath(); mCtx.arc(bx, 54, 5, 0, Math.PI * 2); mCtx.fill();
        mCtx.beginPath(); mCtx.arc(bx, 10, 5, 0, Math.PI * 2); mCtx.fill();
      }
      // "BOULDER" neon red text
      mCtx.fillStyle = '#ff2020';
      mCtx.font = 'bold italic 36px Georgia, serif';
      mCtx.textAlign = 'center'; mCtx.textBaseline = 'middle';
      mCtx.fillText('BOULDER', 256, 32);
      // White glow outline
      mCtx.strokeStyle = 'rgba(255,160,160,0.6)';
      mCtx.lineWidth = 2;
      mCtx.strokeText('BOULDER', 256, 32);
      const mTex = new THREE.CanvasTexture(mCvs);
      mTex.colorSpace = THREE.SRGBColorSpace;
      const signMat = new THREE.MeshStandardMaterial({ map: mTex, roughness: 0.5, side: THREE.DoubleSide });

      // Canopy box
      const canopyCx = wallCx + nx * marqDepth / 2;
      const canopyCz = wallCz + nz * marqDepth / 2;
      const canopy = new THREE.Mesh(
        new THREE.BoxGeometry(marqW, marqThick, marqDepth),
        canopyMat
      );
      canopy.position.set(canopyCx, marqY, canopyCz);
      canopy.rotation.y = -wallAngle;
      canopy.castShadow = true;
      group.add(canopy);

      // Front sign face (plane at outer edge of canopy)
      const signH = 1.6;
      const signPlane = new THREE.Mesh(new THREE.PlaneGeometry(marqW * 0.88, signH), signMat);
      signPlane.position.set(
        wallCx + nx * (marqDepth + 0.08),
        marqY,
        wallCz + nz * (marqDepth + 0.08)
      );
      signPlane.rotation.y = Math.atan2(nx, nz);
      group.add(signPlane);

      // Vertical pylon blade sign — tall enough to clear adjacent buildings
      const pylonH = 7.0;
      const pylonW = 1.6;
      const pylonCvs = document.createElement('canvas');
      pylonCvs.width = 128; pylonCvs.height = 512;
      const pCtx = pylonCvs.getContext('2d');
      // Gold background with subtle gradient
      const pylonGrad = pCtx.createLinearGradient(0, 0, 128, 0);
      pylonGrad.addColorStop(0, '#c8a020');
      pylonGrad.addColorStop(0.5, '#e8c840');
      pylonGrad.addColorStop(1, '#c8a020');
      pCtx.fillStyle = pylonGrad;
      pCtx.fillRect(0, 0, 128, 512);
      // Border
      pCtx.strokeStyle = '#8a6800';
      pCtx.lineWidth = 6;
      pCtx.strokeRect(4, 4, 120, 504);
      // "Boulder" neon-style text — rotated vertically
      pCtx.save();
      pCtx.translate(64, 256);
      pCtx.rotate(-Math.PI / 2);
      pCtx.fillStyle = '#cc1a1a';
      pCtx.font = 'bold italic 54px Georgia, serif';
      pCtx.textAlign = 'center';
      pCtx.textBaseline = 'middle';
      pCtx.fillText('BOULDER', 0, 0);
      // White outline for neon effect
      pCtx.strokeStyle = 'rgba(255,200,200,0.4)';
      pCtx.lineWidth = 2;
      pCtx.strokeText('BOULDER', 0, 0);
      pCtx.restore();
      const pylonTex = new THREE.CanvasTexture(pylonCvs);
      pylonTex.colorSpace = THREE.SRGBColorSpace;
      const pylon = new THREE.Mesh(
        new THREE.BoxGeometry(pylonW, pylonH, 0.18),
        new THREE.MeshStandardMaterial({ map: pylonTex, roughness: 0.3, metalness: 0.4, side: THREE.DoubleSide })
      );
      pylon.position.set(
        wallCx + nx * (marqDepth * 0.5),
        marqY + marqThick / 2 + pylonH / 2,
        wallCz + nz * (marqDepth * 0.5)
      );
      pylon.rotation.y = -wallAngle;
      group.add(pylon);
    }
  }

  return group;
}

function rebuildScene(mode) {
  for (const g of buildingGroups) scene.remove(g);
  buildingGroups = [];

  for (const bld of data.buildings) {
    const mesh = createBuilding(bld, mode);
    const cx = bld.centroid_m[0], cz = bld.centroid_m[1];
    mesh.position.y = getTerrainElevation(cx, cz);
    scene.add(mesh);
    buildingGroups.push(mesh);
  }
}

{
  const bldMap = {};
  for (const bld of data.buildings) bldMap[bld.id] = bld;

  // Sign color palettes — each sign gets a unique look based on name hash
  const signPalettes = [
    { bg: '#1a1a2e', text: '#f5edd8', border: '#c8a850' },  // Classic dark + gold
    { bg: '#2d1b0e', text: '#f0e8d0', border: '#8b6914' },  // Walnut + brass
    { bg: '#0d2b0d', text: '#ffffff', border: '#4a9e4a' },  // Forest green
    { bg: '#1a1a3a', text: '#e8e8ff', border: '#6a6aff' },  // Navy blue
    { bg: '#3a0a0a', text: '#ffd4a0', border: '#cc4444' },  // Burgundy + cream
    { bg: '#f5f0e0', text: '#2a1a0a', border: '#8b7355' },  // Cream + dark text
    { bg: '#1a2a3a', text: '#ffffff', border: '#50a0d0' },  // Slate + sky blue
    { bg: '#2a0a2a', text: '#e8c8ff', border: '#9a4a9a' },  // Plum + lavender
    { bg: '#0a1a2a', text: '#ffd700', border: '#c8a000' },  // Midnight + gold
    { bg: '#3a2a1a', text: '#f5e6d0', border: '#d4a050' },  // Espresso + warm
  ];

  function hashName(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = ((h << 5) - h + name.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function createSignTexture(name) {
    const cvs = document.createElement('canvas');
    const W = 512, H = 128;
    cvs.width = W; cvs.height = H;
    const ctx = cvs.getContext('2d');

    const palette = signPalettes[hashName(name) % signPalettes.length];
    const isLight = palette.bg.charAt(1) > '9';

    // Background panel with gradient
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, palette.bg);
    bgGrad.addColorStop(1, palette.bg);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Material grain
    ctx.globalAlpha = 0.05;
    for (let i = 0; i < 150; i++) {
      ctx.fillStyle = isLight ? '#000' : '#fff';
      ctx.fillRect(Math.random() * W, Math.random() * H, Math.random() * 4, 1);
    }
    ctx.globalAlpha = 1.0;

    // Border — thick with accent color
    ctx.strokeStyle = palette.border;
    ctx.lineWidth = 5;
    ctx.strokeRect(5, 5, W - 10, H - 10);

    // Inner shadow line
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(10, 10, W - 20, H - 20);

    // Text
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let fontSize = 44;
    ctx.font = '700 ' + fontSize + 'px sans-serif';
    while (ctx.measureText(name).width > W - 60 && fontSize > 14) {
      fontSize -= 2;
      ctx.font = '700 ' + fontSize + 'px sans-serif';
    }

    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(name, W / 2 + 1, H / 2 + 2);

    // Main text
    ctx.fillStyle = palette.text;
    ctx.fillText(name, W / 2, H / 2);

    // Top highlight
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(6, 6, W - 12, H * 0.4);
    ctx.globalAlpha = 1.0;

    const tex = new THREE.CanvasTexture(cvs);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  const SIGN_W = 2.4;
  const SIGN_H = 0.7;

  let signCount = 0;
  const mPerDegLon = 111320 * Math.cos(data.ref_lat * Math.PI / 180);
  const mPerDegLat2 = 111320;

  for (let si = 0; si < signsData.length; si++) {
    const sign = signsData[si];
    if (!sign.name) continue;
    const bld = bldMap[sign.building_id];
    if (!bld || !bld.walls || bld.walls.length === 0) continue;

    // Convert sign lat/lon to scene meters
    const sx = (sign.lon - data.ref_lon) * mPerDegLon;
    const sz = (sign.lat - data.ref_lat) * mPerDegLat2;

    // Find wall closest to sign's real-world position
    let bestWall = null;
    let bestDist = Infinity;
    for (let wi = 0; wi < bld.walls.length; wi++) {
      const w = bld.walls[wi];
      if (w.length < 2) continue;
      const wv = w.vertices;
      const wmx = (wv[0][0] + wv[1][0]) / 2;
      const wmz = (wv[0][2] + wv[1][2]) / 2;
      const d = (sx - wmx) * (sx - wmx) + (sz - wmz) * (sz - wmz);
      if (d < bestDist) { bestDist = d; bestWall = w; }
    }
    if (!bestWall) continue;

    const v = bestWall.vertices;
    const x0 = v[0][0], z0 = v[0][2], x1 = v[1][0], z1 = v[1][2];
    const h = bestWall.height;
    const dx = x1 - x0, dz = z1 - z0;
    const len = Math.sqrt(dx * dx + dz * dz);
    if (len < 2) continue;

    const signW = Math.min(SIGN_W, len * 0.7);

    // Sign at top of ground floor
    const stories = (bld.style && bld.style.stories) ? bld.style.stories : Math.max(1, Math.round(h / 3.5));
    const floorH = h / stories;
    const signY = floorH * 0.82;

    // Wall midpoint
    const wallMx = (x0 + x1) / 2, wallMz = (z0 + z1) / 2;

    // Outward normal: perpendicular to wall, pointing away from centroid
    const bcx = bld.centroid_m[0], bcz = bld.centroid_m[1];
    let nx = -dz / len, nz = dx / len;
    // Test: does this normal point away from centroid?
    const testX = wallMx + nx, testZ = wallMz + nz;
    const dTest = (testX - bcx) * (testX - bcx) + (testZ - bcz) * (testZ - bcz);
    const dMid = (wallMx - bcx) * (wallMx - bcx) + (wallMz - bcz) * (wallMz - bcz);
    if (dTest < dMid) { nx = -nx; nz = -nz; }

    const offset = 0.3;
    const px = wallMx + nx * offset;
    const pz = wallMz + nz * offset;
    const terrainY = getTerrainElevation(bld.centroid_m[0], bld.centroid_m[1]);
    const py = terrainY + signY;

    const geom = new THREE.PlaneGeometry(signW, SIGN_H);
    const tex = createSignTexture(sign.name);
    const mat = new THREE.MeshStandardMaterial({
      map: tex, side: THREE.DoubleSide,
      roughness: 0.4, metalness: 0.1,
      emissive: 0x111118, emissiveIntensity: 0.3
    });

    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(px, py, pz);

    // PlaneGeometry faces +Z by default. Rotate so it faces along the outward normal.
    const angle = Math.atan2(nx, nz);
    mesh.rotation.y = angle;

    scene.add(mesh);
    signCount++;
  }
  console.log('Signs rendered:', signCount);
}

function triangulatePoly(pts) {
  if (pts.length < 3) return [];
  const tris = [];
  for (let i = 1; i < pts.length - 1; i++) {
    tris.push(pts[0], pts[i], pts[i + 1]);
  }
  return tris;
}

for (const feat of (data.ground_features || [])) {
  if (feat.points.length < 3) continue;
  const isVegetation = ['park', 'recreation', 'managed', 'horticulture', 'protected', 'grass', 'forest'].includes(feat.subtype);
  if (!isVegetation) continue;
  const color = groundFeatureColors[feat.subtype] || 0x88aa66;
  const roughness = groundFeatureRoughness[feat.subtype] || 0.9;

  const triPts = triangulatePoly(feat.points);
  if (triPts.length < 3) continue;

  const verts = [];
  for (const p of triPts) {
    verts.push(p[0], getTerrainElevation(p[0], p[1]) + 0.01, p[1]);
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geom.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color, roughness, metalness: 0, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);

  // Add grass tufts for vegetation areas
  if (isVegetation && feat.area > 50) {
    const numTufts = Math.min(Math.floor(feat.area / 40), 20);
    const xs = feat.points.map(p => p[0]), ys = feat.points.map(p => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const tufts = [];
    let placed = 0, attempts = 0;
    while (placed < numTufts && attempts < numTufts * 4) {
      attempts++;
      const tx = minX + Math.random() * (maxX - minX);
      const ty = minY + Math.random() * (maxY - minY);
      tufts.push(tx, getTerrainElevation(tx, ty) + 0.15, ty);
      placed++;
    }
    if (tufts.length > 0) {
      const tGeom = new THREE.BufferGeometry();
      tGeom.setAttribute('position', new THREE.Float32BufferAttribute(tufts, 3));
      const tMat = new THREE.PointsMaterial({ color: 0x4a9a3a, size: 0.5, sizeAttenuation: true });
      const tPoints = new THREE.Points(tGeom, tMat);
      scene.add(tPoints);
    }
  }
}

for (const road of (data.roads || [])) {

  const hw = (road.class === 'tertiary' ? 5 : road.class === 'residential' ? 4 : road.class === 'pedestrian' ? 6 : road.class === 'footway' ? 2 : 2.5) / 2;
  const color = roadColors[road.class] || 0x888888;
  const y = road.class === 'footway' || road.class === 'pedestrian' ? 0.15 : 0.12;

  const verts = [];
  for (let i = 0; i < road.points.length - 1; i++) {
    const [x0, z0] = road.points[i];
    const [x1, z1] = road.points[i + 1];
    const dx = x1 - x0, dz = z1 - z0;
    const len = Math.sqrt(dx*dx + dz*dz);
    if (len < 0.3) continue;
    const nx = -dz / len * hw, nz = dx / len * hw;
    const y0t = getTerrainElevation(x0, z0) + y;

    verts.push(

      x0 + nx, y0t, z0 + nz, x1 - nx, y1t, z1 - nz, x0 - nx, y0t, z0 - nz
    );
  }
  if (verts.length === 0) continue;
  const rGeom = new THREE.BufferGeometry();
  rGeom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  rGeom.computeVertexNormals();
  const rMat = new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -5, polygonOffsetUnits: -5 });

// Trees — varied deciduous with multi-cluster canopy
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.9 });
const canopyColors = [0x7ac07a, 0x6db86d, 0x80c880, 0x5aaa5a, 0x70b870, 0x88cc88];
const canopyMats = canopyColors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, flatShading: true }));
for (const tree of (data.trees || [])) {
  const seed = Math.abs(tree.x * 7 + tree.y * 13) | 0;
  const scale = 0.7 + (seed % 10) / 15;
  const trunkH = 2.5 * scale + (seed % 5) * 0.2;
  const trunkR = 0.12 + (seed % 3) * 0.04;

  const treeElev = getTerrainElevation(tree.x, tree.y);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(trunkR * 0.7, trunkR, trunkH, 5), trunkMat);
  trunk.position.set(tree.x, treeElev + trunkH / 2, tree.y);
  trunk.castShadow = true;
  scene.add(trunk);

  const cMat = canopyMats[seed % canopyColors.length];
  const clusters = 2 + (seed % 2);
  const baseY = treeElev + trunkH + 1.2 * scale;
  for (let c = 0; c < clusters; c++) {
    const cr = (1.2 + (c % 2) * 0.5) * scale;
    const angle = (c / clusters) * Math.PI * 2 + seed;
    const offX = Math.cos(angle) * 0.6 * scale;
    const offZ = Math.sin(angle) * 0.6 * scale;
    const offY = (c < 2 ? 0.8 : 0) * scale;
    const cluster = new THREE.Mesh(new THREE.DodecahedronGeometry(cr, 0), cMat);
    cluster.position.set(tree.x + offX, baseY + offY, tree.y + offZ);
    cluster.rotation.set(seed + c, seed * 0.7 + c, 0);
    cluster.castShadow = true;
    scene.add(cluster);
  }
}
