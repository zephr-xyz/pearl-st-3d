  let accum = 20;
  const spacing = 45;
  const roadHW = (road.class === 'tertiary' ? 5 : road.class === 'residential' ? 4 : 6) / 2;
  const lampOffset = roadHW + 0.3 + 1.0;
  for (let i = 0; i < road.points.length - 1; i++) {
    const [x0, z0] = road.points[i];
    const [x1, z1] = road.points[i + 1];
    const dx = x1 - x0, dz = z1 - z0;
    const segLen = Math.sqrt(dx*dx + dz*dz);
    if (segLen < 1) continue;
    const nx = -dz / segLen, nz = dx / segLen;
    while (accum < segLen) {
      const t = accum / segLen;
      const px = x0 + dx * t, pz = z0 + dz * t;
      const side = ((i + Math.floor(accum / spacing)) % 2 === 0) ? 1 : -1;
      const lx = px + nx * lampOffset * side, lz = pz + nz * lampOffset * side;

      const lGroup = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 4.5, 5), lampPoleMat);
      pole.position.y = 2.25;
      lGroup.add(pole);
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.0, 4), lampPoleMat);
      arm.position.set(0.4, 4.3, 0);
      arm.rotation.z = Math.PI / 2.5;
      lGroup.add(arm);
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.15, 5, 3), lampGlowMat);
      lamp.position.set(0.7, 4.2, 0);
      lGroup.add(lamp);

      lGroup.position.set(lx, getTerrainElevation(lx, lz), lz);
      lGroup.rotation.y = Math.atan2(dx, dz);
      lGroup.traverse(c => { if (c.isMesh) c.castShadow = true; });
      scene.add(lGroup);
      accum += spacing;
    }
    accum -= segLen;
  }
}

// Street labels — projected onto road surface
function createRoadLabel(text, length) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 64;
  const ctx2 = c.getContext('2d');
  ctx2.font = '600 36px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx2.textAlign = 'center';
  ctx2.textBaseline = 'middle';
  ctx2.fillStyle = '#ffffff';
  ctx2.fillText(text.toUpperCase(), c.width / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const aspect = c.width / c.height;
  const labelLen = Math.min(length * 0.6, 20);
  const geom = new THREE.PlaneGeometry(labelLen, labelLen / aspect);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.7, depthWrite: false });
  return new THREE.Mesh(geom, mat);
}

for (const label of (data.street_labels || [])) {
  const mesh = createRoadLabel(label.name, 18);
  mesh.rotation.x = -Math.PI / 2;
  const angleRad = label.angle * Math.PI / 180;
  mesh.rotation.z = -angleRad;
  mesh.position.set(label.x, getTerrainElevation(label.x, label.y) + 0.08, label.y);
  scene.add(mesh);
}

// Trees from OSM street furniture data
{
  const treesResp = await fetch('trees.json').catch(() => null);
  if (treesResp && treesResp.ok) {
    const trees = await treesResp.json();
    const refLat = data.ref_lat, refLon = data.ref_lon;
    const mLat = 111320, mLon = 111320 * Math.cos(refLat * Math.PI / 180);

    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c3d1e, roughness: 0.95, metalness: 0 });
    const foliageMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9, metalness: 0 });
    const foliageLightMat = new THREE.MeshStandardMaterial({ color: 0x3d7a32, roughness: 0.85, metalness: 0 });

    const trunkGeom = new THREE.CylinderGeometry(0.1, 0.18, 2.5, 6);
    const canopyGeom = new THREE.SphereGeometry(1.6, 7, 5);

    for (const tree of trees) {
      const tx = (tree.lon - refLon) * mLon;
      const tz = (tree.lat - refLat) * mLat;
      const ty = getTerrainElevation(tx, tz);

      const tGroup = new THREE.Group();
      const trunk = new THREE.Mesh(trunkGeom, trunkMat);
      trunk.position.y = 1.25;
      trunk.castShadow = true;
      tGroup.add(trunk);

      // Two overlapping spheres offset slightly for visual interest
      const mat = (_hashId(tree.id + '') % 2 === 0) ? foliageMat : foliageLightMat;
      const canopy = new THREE.Mesh(canopyGeom, mat);
      canopy.position.y = 3.8;
      canopy.scale.y = 1.1;
      canopy.castShadow = true;
      tGroup.add(canopy);

      tGroup.position.set(tx, ty, tz);
      scene.add(tGroup);
    }
  }
}

// Terrain mesh — background mountains
const terrainGeom = new THREE.PlaneGeometry(
  (terrain.se_lon - terrain.nw_lon) * mPerDegLon,
  (terrain.nw_lat - terrain.se_lat) * mPerDegLat,
  tW - 1, tH - 1
);
const posAttr = terrainGeom.attributes.position;
// Reverse row order: PlaneGeometry row 0 maps to -Z after rotation,
// but data row 0 is north (should be +Z). Flip rows so mesh matches world.
for (let i = 0; i < posAttr.count; i++) {
  const meshRow = Math.floor(i / tW);
  const meshCol = i % tW;
  const dataRow = tH - 1 - meshRow;
  const dataIdx = dataRow * tW + meshCol;
  const elev = terrain.elevations[dataIdx] - baseElev;
  posAttr.setZ(i, elev);
}
posAttr.needsUpdate = true;
terrainGeom.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
  color: 0x8a8580, roughness: 0.95, metalness: 0,
  side: THREE.DoubleSide,
  depthWrite: false,  // never occlude roads/parks above it (log depth buffer makes polygonOffset unreliable at distance)
});
const terrainMesh = new THREE.Mesh(terrainGeom, terrainMat);
terrainMesh.rotation.x = -Math.PI / 2;
terrainMesh.renderOrder = -1;
terrainMesh.position.set(terrainCenterX, -0.1, terrainCenterZ);
terrainMesh.receiveShadow = true;
scene.add(terrainMesh);

// Mode buttons
function setMode(mode) {
  currentMode = mode;
  rebuildScene(mode);
  document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
}
document.getElementById('btn-textured').addEventListener('click', () => { setMode('textured'); document.getElementById('btn-textured').classList.add('active'); });
document.getElementById('btn-color').addEventListener('click', () => { setMode('color'); document.getElementById('btn-color').classList.add('active'); });
document.getElementById('btn-wireframe').addEventListener('click', () => { setMode('wireframe'); document.getElementById('btn-wireframe').classList.add('active'); });

// Expose camera for external navigation (dev/eval use)
window.jumpTo = (px, py, pz, tx, ty, tz) => {
  camera.position.set(px, py, pz);
  controls.target.set(tx ?? 0, ty ?? 4, tz ?? 0);
  controls.update();
};

// Camera presets
document.getElementById('btn-street').addEventListener('click', () => {
  camera.position.set(0, 2.5, 35);
  controls.target.set(0, 4, 0);
});
document.getElementById('btn-birds').addEventListener('click', () => {
  camera.position.set(0, 180, 20);
  controls.target.set(0, 0, 0);
});
document.getElementById('btn-orbit').addEventListener('click', () => {
  camera.position.set(180, 40, -120);
  controls.target.set(-10, 4, -20);
});

// Raycasting
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

canvas.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(scene.children, true);

  let hit = null;
  for (const inter of intersects) {
    let obj = inter.object;
    while (obj.parent && !obj.userData?.id) obj = obj.parent;
    if (obj.userData?.id) { hit = obj.userData; break; }
  }

  if (hit) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';

    const poiLabel = hit.pois && hit.pois.length > 0
      ? hit.pois.join(', ')
      : `Building (${hit.height}m, ${hit.style?.stories || '?'} stories)`;
    const tag = hit.has_mapillary
      ? '<span class="tag tag-direct">VLM-INFORMED FACADE</span>'
      : '';
    const desc = hit.style?.description || '';
    const mat = hit.style?.material ? `Material: ${hit.style.material}` : '';
    const detail = desc || mat || `${hit.walls?.length || 0} faces rendered`;

    tooltip.innerHTML = `<strong>${poiLabel}</strong>${tag ? '<br>' + tag : ''}<br><span style="color:#94a3b8">${detail}</span>`;
  } else {
    tooltip.style.display = 'none';
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

setProgress(100, 'Ready');
setTimeout(() => loadingOverlay.classList.add('hidden'), 300);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
